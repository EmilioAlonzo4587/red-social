# Plantilla para .github/workflows/deploy.yml (issue S1-01).
# Secrets necesarios: VPS_HOST, VPS_USER, VPS_SSH_KEY. El VPS tiene infra/ copiado en ~/app con su .env.
name: Deploy
on:
  push:
    branches: [main]
concurrency: deploy-produccion
permissions:
  contents: read
  packages: write
jobs:
  imagenes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}-${{ matrix.app }}:latest
  desplegar:
    needs: imagenes
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/app
            PREV=$(grep '^IMAGE_TAG=' .env | cut -d= -f2)
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/" .env
            docker compose pull web api
            docker compose run --rm api npx prisma migrate deploy
            docker compose up -d
            for i in $(seq 1 20); do
              if curl -fsS https://$(grep '^DOMAIN=' .env | cut -d= -f2)/api/health >/dev/null; then echo "Desplegado ${{ github.sha }}"; exit 0; fi
              sleep 3
            done
            echo "Health check falló; volviendo a $PREV"
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$PREV/" .env
            docker compose up -d
            exit 1

# Producción en el VPS. Las imágenes se construyen en GitHub Actions y se publican en GHCR.
# Uso en el VPS:  docker compose --env-file .env pull && docker compose --env-file .env up -d
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]

  web:
    image: ghcr.io/${GHCR_OWNER}/${REPO_NAME}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # Las NEXT_PUBLIC_* no van aquí: Next las escribe en el JavaScript al construir la imagen
      # (build-args desde las Variables de GitHub en deploy.yml).
      API_INTERNAL_URL: http://api:3000
    depends_on: [api]

  api:
    image: ghcr.io/${GHCR_OWNER}/${REPO_NAME}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGIN: https://${DOMAIN}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16
    restart: unless-stopped
    # Sin "ports:" a propósito: Docker abre puertos saltándose el firewall del VPS.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  caddy_data:
  caddy_config:

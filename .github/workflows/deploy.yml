# Despliegue a producción (issue S1-01). Corre en cada push a main y a mano desde la pestaña Actions.
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY. Variables (no secretas): NEXT_PUBLIC_APP_URL, NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME.
# El VPS tiene ~/app/.env; compose, Caddyfile y deploy.sh se copian desde infra/ en cada despliegue.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un despliegue a la vez; el siguiente espera a que termine el anterior
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  imagenes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v4
      # GHCR exige nombres en minúsculas; coincide con GHCR_OWNER y REPO_NAME del .env del VPS
      - name: Nombre de la imagen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.app }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          # Solo las usa la web: Next escribe las NEXT_PUBLIC_* en el JavaScript durante el build
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # Reutiliza capas de builds anteriores (caché de GitHub Actions, una por app)
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  desplegar:
    needs: imagenes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar infra/ al VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: infra/docker-compose.yml,infra/Caddyfile,infra/deploy.sh
          target: app/infra-nuevo
          strip_components: 1
          rm: true
      - name: Desplegar
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: bash ~/app/infra-nuevo/deploy.sh ${{ github.sha }}